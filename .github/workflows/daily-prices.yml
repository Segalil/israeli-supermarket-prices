name: Daily price snapshot

on:
  schedule:
    - cron: "0 5 * * *"      # 05:00 UTC = 08:00 בשעון ישראל
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-prices
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build price database
        run: python build_price_db.py

      - name: Archive dated snapshot (compressed CSV)
        run: |
          mkdir -p data
          DATE=$(date +%F)
          # Never replace a same-day snapshot with a poorer one: runs from
          # foreign/cloud IPs are geo-blocked by some chains, while local runs
          # from Israel collect everything — keep whichever has more rows.
          archive() {
            src=$1; dst=$2
            [ -e "$src" ] || return 0
            new_rows=$(wc -l < "$src")
            if [ -e "$dst" ]; then
              old_rows=$(gzip -dc "$dst" | wc -l)
              if [ "$new_rows" -le "$old_rows" ]; then
                echo "keeping existing $dst ($old_rows rows >= $new_rows)"
                return 0
              fi
            fi
            gzip -c "$src" > "$dst"
            echo "wrote $dst ($new_rows rows)"
          }
          for f in out/israeli_prices_*.csv; do
            archive "$f" "data/israeli_prices_${DATE}.csv.gz"
          done
          for f in out/israeli_promos_*.csv; do
            archive "$f" "data/israeli_promos_${DATE}.csv.gz"
          done
          ls -la data

      - name: Commit and push snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Daily price + promo snapshot: $(date +%F)"
          # the pages workflow / manual runs can race us — rebase and retry
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push failed (attempt $attempt), rebasing…"
            git pull --rebase origin main || true
            sleep 5
          done
          git push
