name: Deploy site to GitHub Pages

# Rebuilds the site dataset from the latest snapshot in data/ and deploys the
# static site. Runs after each daily snapshot, on site changes, or manually.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
on:
  workflow_run:
    workflows: ["Daily price snapshot"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "site/**"
      - "build_site_data.py"
      - "israeli_prices/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # after a snapshot run: deploy only if it succeeded
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout (main, includes the latest snapshot)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # stdlib only — no pip install needed
      - name: Build site dataset from latest snapshot
        run: python build_site_data.py

      # The home page's freshness is the PRICE-SNAPSHOT date, not the deploy time:
      # if a daily scrape fails we must not tell crawlers the data changed today.
      # Only the home entry is stamped — the guide pages keep their real dates.
      - name: Stamp sitemap lastmod with the snapshot date
        run: |
          python - <<'PY'
          import gzip, json, pathlib, re
          date = json.loads(gzip.open('site/data/products.json.gz', 'rt', encoding='utf-8').read())['date']
          path = pathlib.Path('site/sitemap.xml')
          xml, n = re.subn(r'(<loc>https://slim-super\.com/</loc>\s*<lastmod>)[^<]+',
                           lambda m: m.group(1) + date, path.read_text(encoding='utf-8'), count=1)
          if n != 1:
              raise SystemExit('sitemap.xml: home <lastmod> not found — was the file reformatted?')
          path.write_text(xml, encoding='utf-8')
          print('sitemap home lastmod ->', date)
          PY

      # GitHub Pages serves max-age=600 and its headers aren't configurable —
      # returning visitors would run stale JS/CSS for up to 10 minutes after a
      # deploy. Stamping the asset URLs with a content hash busts the cache the
      # moment the (revalidated) HTML lands; unchanged files keep their URL.
      - name: Stamp asset URLs for cache busting
        run: |
          JS=$(md5sum site/app.js | cut -c1-8)
          CSS=$(md5sum site/style.css | cut -c1-8)
          sed -i "s|src=\"app.js\"|src=\"app.js?v=$JS\"|; s|href=\"style.css\"|href=\"style.css?v=$CSS\"|" site/index.html
          grep -o 'app.js?v=[a-f0-9]*\|style.css?v=[a-f0-9]*' site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true   # self-enables GitHub Pages on first deploy

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
